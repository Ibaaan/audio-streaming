name: tests

on:
  push:
    paths: ["backend/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/test.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
          args: --build-tags integration

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: make tidy test vuln

  integration:
    runs-on: ubuntu-latest
    # Throwaway credentials: they only exist inside this runner.
    env:
      TEST_POSTGRES_USER: test
      TEST_POSTGRES_PASSWORD: test
      TEST_POSTGRES_DB: test
      MINIO_ENDPOINT: localhost:8333
      MINIO_ACCESS_KEY: ci-access
      MINIO_SECRET_KEY: ci-secret
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start SeaweedFS
        run: |
          cat > s3.json <<EOF
          {"identities": [{"name": "ci",
            "credentials": [{"accessKey": "$MINIO_ACCESS_KEY", "secretKey": "$MINIO_SECRET_KEY"}],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
          EOF
          docker compose up -d seaweedfs
          timeout 60 sh -c 'until curl -s localhost:8333 >/dev/null; do sleep 1; done'
      - run: make integration
