services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: audio-streaming-seaweedfs
    ports:
      - "8333:8333" # S3 API
      - "8888:8888" # filer UI (optional)
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json

  postgres:
    image: postgres:18.6-alpine
    container_name: audio-streaming-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10


  # docker compose --profile test up -d
  postgres-test:
    image: postgres:18.6-alpine
    container_name: audio-streaming-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  seaweedfs-data:
  postgres-data:
